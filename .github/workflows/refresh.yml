name: Refresh data

# Rebuilds data/news.json + data/papers.json from the real sources and commits
# them back to main. GitHub Pages then serves them same-origin, so the page
# needs no CORS-enabled API, no proxy and no API key.
#
# Why this exists: a browser can only call APIs that send
# Access-Control-Allow-Origin. Commercial media feeds do not, and the public
# CORS proxies are dead, rate-limited or key-gated. A runner has no such limit.

on:
  schedule:
    # every hour, on the hour (UTC). Adjust freely — see RATE NOTES below.
    - cron: '7 * * * *'
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

# needed so the job can commit the regenerated JSON back to the repo
permissions:
  contents: write

# never let two refreshes write at the same time
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch real sources
        run: node tools/refresh.js

      - name: Show what was fetched
        run: |
          node -e "
          const m = require('./data/status.json').meta;
          console.log('generated :', m.generated);
          console.log('counts    :', JSON.stringify(m.counts));
          console.log('countries :', m.countries.join(', '));
          console.log('sources   :', m.sources.length);
          "
          du -h data/*.json

      - name: Commit if changed
        run: |
          git config user.name  "tele-track-bot"
          git config user.email "tele-track-bot@users.noreply.github.com"
          git add data/news.json data/papers.json data/status.json
          if git diff --staged --quiet; then
            echo "no change — nothing to commit"
          else
            git commit -m "data: refresh real sources ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

# ---------------------------------------------------------------------------
# RATE NOTES
# The job makes roughly 90 requests per run (12 Federal Register calls, ~55
# Google News queries, ~35 sector feeds, 14 Crossref calls), spaced by short
# sleeps. Hourly is comfortable for all of them. If you ever see 429s, widen the
# cron (e.g. '7 */2 * * *' for every two hours).
#
# A source that is unreachable does not fail the job: each one is probed
# independently and the outcome is written to data/status.json, which the
# dashboard reads to tell the user which sources are live and which are not.
# ---------------------------------------------------------------------------
